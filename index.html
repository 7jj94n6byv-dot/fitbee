<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FitBee 小程序 · 手机预览</title>
<style>
/* ============================================================
   FitBee 小程序版 · 手机模拟器样式
   设计语言：Lovable（design-md-collection / lovable/DESIGN.md）
   - 奶油底 #f7f4ed · 炭黑 #1c1c1c · 暖边框 #eceae4
   - 暗色 inset 阴影按钮 · 6px/12px 圆角体系
   - 语义：暖调绿=达标 · 琥珀=接近上限 · 赤陶=超标
   - 底部 TabBar：漂浮胶囊 + 滑动指示器（参考 Keep/薄荷健康）
   - 卡片切换：按压缩放 + 内容淡入上滑
   ============================================================ */
:root {
  --cream: #f7f4ed;
  --cream-deep: #efe9dd;
  --off-white: #fcfbf8;
  --charcoal: #1c1c1c;
  --charcoal-83: rgba(28, 28, 28, 0.83);
  --charcoal-82: rgba(28, 28, 28, 0.82);
  --muted: #5f5f5d;
  --muted-soft: #8a8a86;
  --border: #eceae4;
  --border-strong: rgba(28, 28, 28, 0.4);
  --ink-4: rgba(28, 28, 28, 0.04);
  --ok: #6a9a6a;
  --ok-bg: #eef4ec;
  --warn: #c99a3d;
  --warn-bg: #faf3e0;
  --over: #c96a4d;
  --over-bg: #f8e9e2;
  --r-sm: 6px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 9999px;
  --shadow-inset: rgba(255, 255, 255, 0.2) 0 0.5px 0 0 inset, rgba(0, 0, 0, 0.2) 0 0 0 0.5px inset, rgba(0, 0, 0, 0.05) 0 1px 2px 0;
  --shadow-focus: rgba(0, 0, 0, 0.1) 0 4px 12px;
  --shadow-lift: rgba(28, 28, 28, 0.08) 0 8px 24px;
  --font: "PingFang SC", "HarmonyOS Sans SC", "MiSans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar-h: 60px;
  --statusbar-h: 44px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: var(--font); background: #d9d4c8; display: flex; justify-content: center; align-items: flex-start; padding: 24px 0; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: rgba(28,28,28,0.08); }

/* ============ 手机外框 ============ */
.phone {
  width: 375px; height: 812px; background: var(--cream);
  border-radius: 32px; overflow: hidden; position: relative;
  box-shadow: 0 24px 60px rgba(0,0,0,0.28);
  display: flex; flex-direction: column;
}
/* 真机全屏：窄屏（手机）下去掉模拟器外框，占满整个屏幕 */
@media (max-width: 520px) {
  body { padding: 0; background: var(--cream); }
  .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  .statusbar { padding-top: env(safe-area-inset-top); }
}
/* 状态栏：下移留白，参考健康 App（Keep / 薄荷健康）的顶部安全区排版 */
.statusbar {
  height: var(--statusbar-h); flex: none;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 20px 6px; font-size: 13px; color: var(--charcoal); font-weight: 600;
  letter-spacing: 0.2px;
}
.page-scroll { flex: 1; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--tabbar-h) + 20px); }
.page-scroll::-webkit-scrollbar { display: none; }

/* ============ 底部 TabBar（漂浮胶囊 + 滑动指示器） ============ */
.tabbar {
  position: absolute; left: 12px; right: 12px; bottom: 12px; height: var(--tabbar-h);
  background: rgba(252, 251, 248, 0.94);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lift);
  display: flex; z-index: 50;
  overflow: hidden;
}
.tab {
  position: relative; flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted-soft); font-size: 10px;
  transition: color 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}
.tab .t-ic { width: 22px; height: 22px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.25s; }
.tab .t-ic svg { width: 22px; height: 22px; }
.tab .t-lb { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s; font-weight: 400; }
/* 活动指示器：随选中项滑动的暖色胶囊底 */
.tab-indicator {
  position: absolute; top: 6px; bottom: 6px; width: calc((100% - 0px) / 5);
  left: 0; border-radius: 12px;
  background: var(--cream-deep);
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 0;
}
/* 选中态：图标弹跳放大 + 标签上移变炭黑 */
.tab.active { color: var(--charcoal); }
.tab.active .t-ic { transform: translateY(-1px) scale(1.12); color: var(--charcoal); }
.tab.active .t-lb { font-weight: 600; transform: translateY(0); }

/* ============ 通用 ============ */
.pad { padding: 0 16px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 15px; padding: 12px 18px; border-radius: var(--r-sm);
  transition: opacity 0.15s, transform 0.1s; line-height: 1.2;
}
.btn:active { opacity: 0.8; transform: scale(0.98); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--charcoal); color: var(--off-white); box-shadow: var(--shadow-inset); }
.btn-primary:active { transform: scale(0.97); }
.btn-primary { position: relative; overflow: hidden; }
.btn-primary::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 60%); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.btn-primary:active::before { opacity: 1; }
.btn-ghost { background: transparent; color: var(--charcoal); border: 1px solid var(--border-strong); }
.btn-cream { background: var(--cream-deep); color: var(--charcoal); }
.btn-block { width: 100%; }
.btn-sm { font-size: 13px; padding: 9px 16px; }
.btn:disabled { opacity: 0.4; }
.shimmer-btn { position: relative; overflow: hidden; }
.shimmer-btn::after {
  content: ""; position: absolute; top: 0; left: -60%; width: 45%; height: 100%;
  background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transform: skewX(-20deg);
  animation: shimmer-sweep 3s ease-in-out infinite;
}
@keyframes shimmer-sweep { 0% { left: -60%; } 55%, 100% { left: 130%; } }
.press { transition: transform 0.12s ease; }
.press:active { transform: scale(0.97); }
.fade-in { animation: fade-in 0.3s ease both; }
@keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.num-bounce { display: inline-block; animation: num-bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes num-bounce { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1); } }
.tag-pop { animation: tag-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes tag-pop { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* ============ 增强动效层 ============ */
/* 全局按钮点击动效：涟漪波纹 + 按压弹性 */
.fx-btn { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.fx-btn:active { transform: scale(0.96); }
.fx-btn .fx-wave {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.45);
  transform: scale(0); animation: fx-wave 0.5s ease-out forwards;
  pointer-events: none; z-index: 1;
}
.fx-btn .fx-wave.dark { background: rgba(28,28,28,0.18); }
@keyframes fx-wave { to { transform: scale(3); opacity: 0; } }
/* 点击弹跳（卡片/条目） */
.fx-card:active { animation: fx-card-pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes fx-card-pop { 0% { transform: scale(1); } 40% { transform: scale(0.96); } 100% { transform: scale(1); } }
/* 图标点击微弹 */
.fx-ic:active svg { animation: fx-ic-pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes fx-ic-pop { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }
/* 成功勾选反馈 */
.fx-done:active { animation: fx-done 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes fx-done { 0% { transform: scale(1); } 30% { transform: scale(1.1); } 60% { transform: scale(0.95); } 100% { transform: scale(1); } }
/* TabBar 图标弹性旋转 */
.tab .t-ic { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.tab.active .t-ic { animation: tab-wiggle 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes tab-wiggle { 0% { transform: scale(1); } 30% { transform: scale(1.25) rotate(-8deg); } 60% { transform: scale(0.95) rotate(6deg); } 100% { transform: scale(1.12); } }
/* 指示器光晕 */
.tab-indicator { box-shadow: 0 2px 8px rgba(28,28,28,0.06); }
/* 卡片错峰滑入（列表/网格） */
.list-in { animation: list-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
@keyframes list-in { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
/* 卡片按压涟漪 */
.ripple { position: relative; overflow: hidden; }
.ripple::after { content: ""; position: absolute; border-radius: 50%; background: rgba(28,28,28,0.12); transform: scale(0); opacity: 1; transition: transform 0.5s, opacity 0.5s; pointer-events: none; }
.ripple:active::after { transform: scale(3); opacity: 0; }
/* 按钮悬浮微光（主按钮） */
.glow-btn { position: relative; overflow: hidden; }
.glow-btn::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 60%); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.glow-btn:active::before { opacity: 1; }
/* 弹层：遮罩淡入 + 内容弹入 */
.mask { animation: mask-in 0.2s ease; }
@keyframes mask-in { from { opacity: 0; } to { opacity: 1; } }
.sheet { animation: sheet-up 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes sheet-up { from { transform: translateY(60px); opacity: 0.5; } to { transform: none; opacity: 1; } }
/* 数字滚动变化 */
.num-roll { display: inline-block; animation: num-roll 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes num-roll { 0% { transform: translateY(12px); opacity: 0; } 100% { transform: none; opacity: 1; } }
/* 徽章弹跳（toast） */
.toast-pop { animation: toast-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes toast-pop { 0% { transform: translateX(-50%) translateY(12px) scale(0.9); opacity: 0; } 100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; } }
/* 热量环加载动画 */
.ring { transition: background 0.6s ease; }
/* 喝水水位上升 */
.ql-fill { transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
/* 心跳（记录成功图标） */
.heart-beat { animation: heart-beat 0.8s ease infinite; }
@keyframes heart-beat { 0%, 100% { transform: scale(1); } 25% { transform: scale(1.15); } 40% { transform: scale(1); } 55% { transform: scale(1.1); } }
/* 页面内容分层浮现 */
.stagger > * { animation: list-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
.stagger > *:nth-child(2) { animation-delay: 0.05s; }
.stagger > *:nth-child(3) { animation-delay: 0.1s; }
.stagger > *:nth-child(4) { animation-delay: 0.15s; }
.stagger > *:nth-child(5) { animation-delay: 0.2s; }
.stagger > *:nth-child(6) { animation-delay: 0.25s; }
.stagger > *:nth-child(7) { animation-delay: 0.3s; }
.stagger > *:nth-child(8) { animation-delay: 0.35s; }
@media (prefers-reduced-motion: reduce) {
  .shimmer-btn::after, .fade-in, .num-bounce, .tag-pop, .list-in, .tab.active .t-ic, .sheet, .num-roll { animation: none; }
  .tab-indicator { transition: none; }
}
.card { background: var(--cream); border: 1px solid var(--border); border-radius: var(--r-md); transition: transform 0.2s, box-shadow 0.2s; }
.tag {
  display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500;
  padding: 2px 8px; border-radius: var(--r-pill); background: var(--cream-deep); color: var(--charcoal-83);
}
.tag svg { width: 11px; height: 11px; }
.tag-green { background: var(--ok-bg); color: #4a7a4a; }
.tag-amber { background: var(--warn-bg); color: #9a7420; }
.tag-red { background: var(--over-bg); color: #a34a30; }
.tag-blue { background: rgba(59,130,246,0.12); color: #2563c9; }
.h1 { font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -0.5px; }
.h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.4px; line-height: 1.25; }
.h3 { font-size: 16px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.micro { font-size: 10px; color: var(--muted-soft); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.row { display: flex; align-items: center; }
.between { justify-content: space-between; }
.gap8 { gap: 8px; } .gap10 { gap: 10px; }
.flex1 { flex: 1; min-width: 0; }
.navbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px 8px;
  position: sticky; top: 0; z-index: 40; background: rgba(247,244,237,0.94); backdrop-filter: blur(10px);
}
.navbar .back { width: 32px; height: 32px; border-radius: 50%; background: var(--cream-deep); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-inset); }
.navbar .back svg { width: 16px; height: 16px; }
.navbar .tt { font-size: 17px; font-weight: 600; flex: 1; text-align: center; margin-right: 32px; }
.navbar .sp { width: 32px; }

/* ============ 首页 ============ */
.home-hero { padding: 18px 16px 6px; }
.greet { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.greet .nm { font-size: 15px; font-weight: 600; }
.greet .dt { font-size: 11px; color: var(--muted); margin-top: 2px; }
.greet-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--cream-deep); display: flex; align-items: center; justify-content: center; color: var(--charcoal); box-shadow: var(--shadow-inset); }
.greet-avatar svg { width: 20px; height: 20px; }
.ring-dash { padding: 20px 18px; }
.ring-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.ring-title { font-size: 16px; font-weight: 600; }
.ring-wrap { display: flex; align-items: center; gap: 18px; }
.ring {
  position: relative; width: 104px; height: 104px; flex: none; border-radius: 50%;
  background: conic-gradient(var(--charcoal) calc(var(--pct) * 1%), var(--cream-deep) 0);
  display: flex; align-items: center; justify-content: center;
}
.ring::before { content: ""; position: absolute; inset: 9px; background: var(--cream); border-radius: 50%; }
.ring-center { position: relative; text-align: center; }
.ring-center .v { font-size: 20px; font-weight: 600; letter-spacing: -0.4px; }
.ring-center .l { font-size: 9px; color: var(--muted); }
.ring-nums { display: flex; flex-direction: column; gap: 6px; }
.ring-num { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.ring-num b { font-size: 14px; color: var(--charcoal); font-weight: 600; margin-left: auto; font-variant-numeric: tabular-nums; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot-ok { background: var(--ok); } .dot-warn { background: var(--warn); } .dot-over { background: var(--over); }
.quick-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
/* 运动消耗（今日目标下方内联） */
.sport-inline { margin-top: 2px; padding-top: 6px; border-top: 1px dashed var(--border); }
.nums-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.num-box { background: var(--cream-deep); border-radius: 10px; padding: 10px 8px; text-align: center; }
.num-box .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.num-box .v small { font-size: 9px; font-weight: 400; color: var(--muted); }
.num-box .l { font-size: 10px; color: var(--muted); margin-top: 2px; }
/* 喝水/体重 快捷记录（放大版 + 背景可视化） */
.quick-log-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.quick-log {
  position: relative; overflow: hidden;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 16px 14px; background: var(--off-white); border: 1px solid var(--border); border-radius: 14px;
  text-align: left; min-height: 108px;
}
.quick-log .ql-bg { position: absolute; inset: 0; pointer-events: none; }
/* 喝水背景：刻度线 + 进度填充 */
.quick-log .ql-bg-water { background: repeating-linear-gradient(90deg, transparent 0, transparent calc(12.5% - 1px), var(--cream-deep) calc(12.5% - 1px), var(--cream-deep) 12.5%); opacity: 0.9; }
.quick-log .ql-scale { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; }
.quick-log .ql-tick { position: absolute; bottom: 0; width: 1px; height: 12px; background: var(--border-strong); opacity: 0.35; }
.quick-log .ql-fill { position: absolute; left: 0; bottom: 0; top: 0; background: linear-gradient(180deg, rgba(106,154,106,0.14), rgba(106,154,106,0.05)); border-right: 2px solid rgba(106,154,106,0.5); transition: width 0.5s ease; }
/* 体重背景：曲线 */
.quick-log .ql-bg-weight { opacity: 0.85; }
.quick-log .ql-curve { position: absolute; inset: 0; width: 100%; height: 100%; }
.quick-log > *:not(.ql-bg) { position: relative; z-index: 1; }
.quick-log .ql-ic { width: 40px; height: 40px; border-radius: 11px; background: var(--cream-deep); display: flex; align-items: center; justify-content: center; color: var(--charcoal); flex: none; box-shadow: var(--shadow-inset); }
.quick-log .ql-ic svg { width: 21px; height: 21px; }
.quick-log .ql-t { display: block; font-size: 15px; font-weight: 600; }
.quick-log .ql-s { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 500; }
.ql-num-water { color: #4a90d9; font-weight: 700; font-variant-numeric: tabular-nums; }
.quick-log .ql-s2 { display: block; font-size: 10px; color: var(--muted-soft); margin-top: 2px; }
.quick-log .ql-go { color: var(--muted-soft); display: flex; flex: none; }
.quick-log .ql-go svg { width: 14px; height: 14px; }
/* 喝水进度条（卡片内） */
.quick-log .ql-progress { display: block; height: 5px; background: var(--cream-deep); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.quick-log .ql-pbar { display: block; height: 100%; background: var(--ok); border-radius: 3px; transition: width 0.5s ease; }
/* 每日目标设置 */
.goal-set { display: flex; align-items: center; justify-content: space-between; background: var(--off-white); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
.goal-stepper { display: flex; align-items: center; gap: 8px; }
.goal-stepper button { width: 30px; height: 30px; border-radius: 50%; background: var(--cream-deep); display: flex; align-items: center; justify-content: center; }
.goal-stepper button svg { width: 14px; height: 14px; }
.goal-val { font-size: 17px; font-weight: 600; min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
.goal-unit { font-size: 11px; color: var(--muted); }
/* 喝水饮品网格 */
.drink-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.drink-tile {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 6px; background: var(--off-white); border: 1px solid var(--border);
  border-radius: 10px;
}
.drink-tile .d-ic { width: 32px; height: 32px; border-radius: 9px; background: var(--cream-deep); display: flex; align-items: center; justify-content: center; color: var(--charcoal); }
.drink-tile .d-ic svg { width: 18px; height: 18px; }
.drink-tile .d-nm { font-size: 12px; font-weight: 500; }
.drink-tile .d-ml { font-size: 9px; color: var(--muted-soft); }
.water-stepper { display: flex; align-items: center; justify-content: center; gap: 20px; }
.water-stepper button { width: 40px; height: 40px; border-radius: 50%; background: var(--cream-deep); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-inset); }

}

<script>
/* FitBee 共享工具 —— 本地状态 / 热量计算 / UI 辅助 */
(function () {
  const DEFAULTS = {
    profile: {
      gender: "female",
      age: 28,
      height: 162,
      weight: 62,
      targetWeight: 52,
      pace: "standard",       // gentle | standard | aggressive
      persona: "standard",    // light | standard | heavy
      method: "168",          // 当前采用方法
      activity: 1.375,
      waterGoal: 2000         // 每日喝水目标 ml
    },
    records: { food: [], exercise: [], water: [], weight: [], diary: [], ledger: [] },
    foodTemplates: [],   // 自定义食物模板 { name, kcal, protein, carbs, fat, ts }
    favorites: [],
    settings: { unit: "kg", notify: true, customCats: [], aiKey: "" },   // aiKey: 可选 DeepSeek API Key 用于 AI 生成食谱
    milestones: {}   // { '20': true, '50': ... } 已庆祝过的里程碑
  };

  function load() {
    try {
      const raw = localStorage.getItem("fitbee_state");
      if (!raw) return JSON.parse(JSON.stringify(DEFAULTS));
      const s = JSON.parse(raw);
      // 深度合并：老数据缺失的新字段（records.water/weight、milestones、profile.startWeight 等）自动补齐
      const base = JSON.parse(JSON.stringify(DEFAULTS));
      base.records = Object.assign({}, base.records, s.records || {});
      base.profile = Object.assign({}, base.profile, s.profile || {});
      base.settings = Object.assign({}, base.settings, s.settings || {});
      return Object.assign(base, s, {
        records: base.records,
        profile: base.profile,
        settings: base.settings,
        milestones: Object.assign({}, base.milestones, s.milestones || {})
      });
    } catch (e) { return JSON.parse(JSON.stringify(DEFAULTS)); }
  }
  function save(s) { localStorage.setItem("fitbee_state", JSON.stringify(s)); }
  function setState(patch) {
    const s = load();
    if (typeof patch === "function") patch(s);
    else Object.assign(s, patch);
    save(s);
    return s;
  }

  /* Mifflin-St Jeor BMR */
  function bmr(p) {
    const base = 10 * p.weight + 6.25 * p.height - 5 * p.age;
    return p.gender === "male" ? base + 5 : base - 161;
  }
  function tdee(p) { return Math.round(bmr(p) * p.activity); }
  function deficit(p) {
    return p.pace === "gentle" ? 250 : p.pace === "aggressive" ? 750 : 500;
  }
  function dailyIntake(p) { return Math.max(1000, Math.round(tdee(p) - deficit(p))); }
  function exerciseGoal(p) {
    const d = deficit(p);
    return p.persona === "heavy" ? Math.round(d * 0.55) : p.persona === "light" ? Math.round(d * 0.35) : Math.round(d * 0.45);
  }
  function caloriesFor(food, grams) { return Math.round(food.calories * grams / 100); }
  function exerciseBurn(ex, minutes, intensity) {
    const factor = intensity === "light" ? 0.7 : intensity === "hard" ? 1.3 : 1;
    return Math.round(ex.met * 62 * (minutes / 60) * factor);
  }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function todaySummary(s) {
    const k = todayKey();
    const foods = (s.records.food || []).filter(r => r.date === k);
    const exes = (s.records.exercise || []).filter(r => r.date === k);
    const waters = (s.records.water || []).filter(r => r.date === k);
    const ledgers = (s.records.ledger || []).filter(r => r.date === k);
    const intake = foods.reduce((a, r) => a + r.kcal, 0);
    const burned = exes.reduce((a, r) => a + r.kcal, 0);
    const waterMl = waters.reduce((a, r) => a + r.ml, 0);
    const foodCost = foods.reduce((a, r) => a + (r.cost || 0), 0);
    const expenseTotal = ledgers.filter(l => l.type !== "income").reduce((a, r) => a + (r.amount || 0), 0);
    const incomeTotal = ledgers.filter(l => l.type === "income").reduce((a, r) => a + (r.amount || 0), 0);
    const ledgerTotal = expenseTotal;
    const b = bmr(s.profile);
    const target = dailyIntake(s.profile);
    const remaining = target - intake;
    const status = remaining < 0 ? "over" : remaining <= target * 0.2 ? "close" : "ok";
    // 体重目标进度：初始体重→目标体重的完成百分比
    const startW = s.profile.startWeight || s.profile.weight;
    const curW = s.records.weight && s.records.weight.length
      ? s.records.weight[s.records.weight.length - 1].kg
      : s.profile.weight;
    let progress = 0;
    if (s.profile.targetWeight < startW) {
      progress = Math.min(100, Math.max(0, Math.round((startW - curW) / (startW - s.profile.targetWeight) * 100)));
    }
    return { foods, exes, waters, ledgers, intake, burned, waterMl, foodCost, expenseTotal, incomeTotal, ledgerTotal, bmr: b, target, remaining, status, weightProgress: progress };
  }

  window.FITBEE = { DEFAULTS, load, save, setState, bmr, tdee, deficit, dailyIntake, exerciseGoal, caloriesFor, exerciseBurn, todayKey, todaySummary };
})();

</script>

<script>
/* FitBee 小程序版主逻辑（手机模拟） */
(function () {
  const D = window.FITBEE_DATA;
  const F = window.FITBEE;
  const IC = (n) => window.FITBEE_ICON(n) || "";
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const scroll = () => $("#page-scroll");

  /* ================= AI 抠图 API 预留接口 =================
     配置后启用 AI 自动抠图；未配置时降级为本地颜色显著性抠图。
     对接示例（任意支持图像分割的 AI 服务）：
       AI_REMOVE_BG_API = "https://your-api.example.com/remove-bg"
       请求体: { "image": "<base64 dataURL>" }
       响应体: { "image": "<透明背景 PNG dataURL>" }
  */
  const AI_REMOVE_BG_API = "";   // 填入后端抠图接口地址即启用
  const AI_REMOVE_BG_HEADERS = { "Content-Type": "application/json" };
  function aiRemoveBackground(imgDataUrl, cb) {
    if (!AI_REMOVE_BG_API) { cb(null); return; }
    try {
      fetch(AI_REMOVE_BG_API, {
        method: "POST",
        headers: AI_REMOVE_BG_HEADERS,
        body: JSON.stringify({ image: imgDataUrl })
      }).then(r => r.json()).then(data => {
        if (data && data.image) cb(data.image);
        else cb(null);
      }).catch(() => cb(null));
    } catch (e) { cb(null); }
  }

  let tab = "home";
  let curMeal = "早餐";
  let curFood = null;
  let curExercise = null;
  let intensity = "medium";
  let quizStep = 0, quizAnswers = [];

  const WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

  /* ================= 导航 ================= */
  function moveIndicator(t) {
    const ind = $("#tab-indicator");
    const tabEl = document.querySelector('.tab[data-tab="' + t + '"]');
    if (!ind || !tabEl) return;
    const tabs = Array.from(tabEl.parentElement.querySelectorAll(".tab"));
    const idx = tabs.indexOf(tabEl);
    if (idx < 0) return;
    // 每格宽度 = 父容器宽度 / tab 数量（等分，避免 offsetWidth 误差）
    const w = tabEl.parentElement.clientWidth / tabs.length;
    ind.style.transform = "translateX(" + (idx * w) + "px)";
  }
  function goTab(t) {
    tab = t;
    $$(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
    ["home", "kb", "detail", "compare", "food", "exercise", "me", "quiz", "diary", "ledger"].forEach(p => {
      const el = $("#page-" + p);
      if (el) el.style.display = p === t ? "" : "none";
    });
    scroll().scrollTop = 0;
    render();
    moveIndicator(t);
    // 页面进入淡入动效
    const cur = $("#page-" + t);
    if (cur) {
      cur.classList.remove("fade-in");
      void cur.offsetWidth;
      cur.classList.add("fade-in");
    }
  }
  // 从"我的-设置-方法"进入方法库（无对应 tab）
  let kbFrom = "";   // "home" 表示从首页热门方法进入方法库
  function goKb() {
    kbFrom = "";
    tab = "kb";
    $$(".tab").forEach(b => b.classList.remove("active"));
    ["home", "kb", "detail", "compare", "food", "exercise", "me", "quiz", "diary"].forEach(p => {
      const el = $("#page-" + p);
      if (el) el.style.display = p === "kb" ? "" : "none";
    });
    scroll().scrollTop = 0;
    render();
    const cur = $("#page-kb");
    if (cur) {
      cur.classList.remove("fade-in");
      void cur.offsetWidth;
      cur.classList.add("fade-in");
    }
  }
  // 从首页"查看全部"进入方法库
  function goKbFromHome() {
    kbFrom = "home";
    tab = "kb";
    $$(".tab").forEach(b => b.classList.remove("active"));
    ["home", "kb", "detail", "compare", "food", "exercise", "me", "quiz", "diary", "ledger"].forEach(p => {
      const el = $("#page-" + p);
      if (el) el.style.display = p === "kb" ? "" : "none";
    });
    scroll().scrollTop = 0;
    render();
    const cur = $("#page-kb");
    if (cur) {
      cur.classList.remove("fade-in");
      void cur.offsetWidth;
      cur.classList.add("fade-in");
    }
  }
  // 方法库返回：按来源
  function kbBack() {
    if (kbFrom === "home") goTab("home");
    else goTab("me");
  }

  // 从首页"记录运动"进入运动记录（无 tab，返回首页）
  function goExercise() {
    tab = "exercise";
    $$(".tab").forEach(b => b.classList.remove("active"));
    ["home", "kb", "detail", "compare", "food", "exercise", "me", "quiz", "diary", "ledger"].forEach(p => {
      const el = $("#page-" + p);
      if (el) el.style.display = p === "exercise" ? "" : "none";
    });
    scroll().scrollTop = 0;
    render();
    const cur = $("#page-exercise");
    if (cur) {
      cur.classList.remove("fade-in");
      void cur.offsetWidth;
      cur.classList.add("fade-in");
    }
  }

  // 从饮食页进入智能食谱（无 tab，返回饮食页）
  function goRecipe() {
    tab = "recipe";
    $$(".tab").forEach(b => b.classList.remove("active"));
    ["home", "kb", "detail", "compare", "food", "recipe", "exercise", "me", "quiz", "diary", "ledger"].forEach(p => {
      const el = $("#page-" + p);
      if (el) el.style.display = p === "recipe" ? "" : "none";
    });
    scroll().scrollTop = 0;
    render();
    const cur = $("#page-recipe");
    if (cur) {
      cur.classList.remove("fade-in");
      void cur.offsetWidth;
      cur.classList.add("fade-in");
    }
  }

  function diffTag(d) {
    return d === "extreme" ? "tag-red" : d === "high" ? "tag-amber" : d === "medium" ? "tag-blue" : "tag-green";
  }

  function render() {
    if (tab === "home") renderHome();
    else if (tab === "kb") renderKb();
    else if (tab === "detail") renderDetail();
    else if (tab === "compare") renderCompare();
    else if (tab === "food") renderFood();
    else if (tab === "recipe") renderRecipe();
    else if (tab === "exercise") renderExercise();
    else if (tab === "me") renderMe();
    else if (tab === "quiz") renderQuiz();
    else if (tab === "diary") renderDiary();
    else if (tab === "ledger") renderLedgerPage();
  }

  /* ================= 首页 ================= */
  // 喝水刻度线：底部横向刻度（0~目标 均分 8 格）
  function waterScaleHtml() {
    let ticks = "";
    for (let i = 0; i <= 8; i++) {
      ticks += '<span class="ql-tick" style="left:' + (i * 12.5) + '%"></span>';
    }
    return ticks;
  }
  // 体重曲线：SVG 折线（体重历史，含目标线）
  function weightCurveHtml(s) {
    const hist = (s.records.weight || []).slice(-10);
    if (hist.length < 2) {
      // 不足 2 个点：画一条从当前体重到目标的示意虚线（浅色，避免遮挡文字）
      return '<svg class="ql-curve" viewBox="0 0 160 60" preserveAspectRatio="none"><line x1="8" y1="12" x2="152" y2="42" stroke="rgba(28,28,28,0.18)" stroke-width="1.2" stroke-dasharray="4 3"/></svg>';
    }
    const W = 160, H = 60, pad = 8;
    const vals = hist.map(h => h.kg);
    const min = Math.min(...vals, s.profile.targetWeight) - 1;
    const max = Math.max(...vals, s.profile.weight) + 1;
    const x = i => pad + (W - pad * 2) * (i / (hist.length - 1));
    const y = v => pad + (H - pad * 2) * (1 - (v - min) / (max - min));
    let d = hist.map((h, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(h.kg).toFixed(1)).join(" ");
    const pts = hist.map((h, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(h.kg).toFixed(1)}" r="1.8" fill="rgba(28,28,28,0.45)"/>`).join("");
    const targetY = y(s.profile.targetWeight).toFixed(1);
    return `<svg class="ql-curve" viewBox="0 0 160 60" preserveAspectRatio="none">
      <line x1="8" y1="${targetY}" x2="152" y2="${targetY}" stroke="rgba(201,154,61,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="${d}" fill="none" stroke="rgba(28,28,28,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts}
    </svg>`;
  }
  function renderHome() {
    const s = F.load();
    const sum = F.todaySummary(s);
    const meta = sum.status === "over" ? { cls: "dot-over", label: "已超标" }
      : sum.status === "close" ? { cls: "dot-warn", label: "接近上限" } : { cls: "dot-ok", label: "达标" };
    const pct = Math.min(100, Math.round(sum.intake / sum.target * 100));
    const d = new Date();
    const hour = d.getHours();
    const greet = hour < 6 ? "夜深了" : hour < 11 ? "早上好" : hour < 14 ? "中午好" : hour < 18 ? "下午好" : "晚上好";
    const meals = ["早餐", "午餐", "晚餐", "加餐"];
    const listHtml = meals.map(meal => {
      const items = sum.foods.map((r, i) => ({ r, i })).filter(x => x.r.meal === meal);
      if (!items.length) return "";
      const kcal = items.reduce((a, x) => a + x.r.kcal, 0);
      return items.map(x => `
        <div class="rec-item">
          <span class="meal-pill">${meal}</span>
          <span class="em"><svg viewBox="0 0 24 24" fill="none"><path d="M5 3v7a1.5 1.5 0 0 0 3 0V3M6.5 3v3M15 3v18M15 3c3 0 4.5 2.6 4.5 5.5S18 12 15 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="nm">${x.r.name}</span>
          <span class="micro">${x.r.grams}g</span>
          <span class="kc">${x.r.kcal}</span>
          <button class="del" onclick="M.delFood(${x.i})"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        </div>`).join("");
    }).join("");
    const exHtml = sum.exes.map((r, i) => `
      <div class="rec-item">
        <span class="em">${IC(r.icon)}</span>
        <span class="nm">${r.name}</span>
        <span class="micro">${r.minutes}min · ${r.intensity}</span>
        <span class="kc">${r.kcal}</span>
        <button class="del" onclick="M.delEx(${i})"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>`).join("");
    const waterHtml = sum.waters.map((r, i) => `
      <div class="rec-item">
        <span class="em">${IC(r.icon || "water")}</span>
        <span class="nm">${r.name}</span>
        <span class="micro"></span>
        <span class="kc">${r.ml} ml</span>
        <button class="del" onclick="M.delWater(${i})"><svg viewBox="0 0 24 24" fill="none"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      </div>`).join("");

    $("#page-home").innerHTML = `
      <div class="home-hero stagger">
        <div class="greet">
          <div><div class="nm">${greet}，瘦瘦</div>
          <div class="dt">${d.getMonth() + 1}月${d.getDate()}日 ${WEEK[d.getDay()]} · ${sum.status === 'over' ? '今天要控制一下了' : '继续保持好状态'}</div></div>
          <div style="width:36px;height:36px;border-radius:50%;background:var(--cream-deep);display:flex;align-items:center;justify-content:center;color:var(--charcoal)"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20.5c1.2-3.5 4-5.5 7.5-5.5s6.3 2 7.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
        </div>
        <div class="card ring-dash">
          <div class="ring-head">
            <div class="ring-title">今日热量盈亏</div>
            <span class="tag ${meta.cls === 'dot-over' ? 'tag-red' : meta.cls === 'dot-warn' ? 'tag-amber' : 'tag-green'}">${meta.label}</span>
          </div>
          <div class="ring-wrap">
            <div class="ring" style="--pct:${pct}">
              <div class="ring-center"><div class="v">${pct}%</div><div class="l">已用额度</div></div>
            </div>
            <div class="ring-nums" style="flex:1">
              <div class="ring-num"><span class="status-dot ${meta.cls}"></span>还可摄入<b>${Math.max(0, sum.remaining)}</b></div>
              <div class="ring-num"><span class="status-dot dot-over"></span>已摄入<b>${sum.intake}</b></div>
              <div class="ring-num"><span class="status-dot dot-ok"></span>今日目标<b>${sum.target}</b></div>
              <div class="ring-num sport-inline"><span class="status-dot dot-ok" style="background:var(--warn)"></span>运动消耗<b>${sum.burned}</b></div>
            </div>
          </div>
          <div class="quick-cta">
            <button class="btn btn-primary btn-sm shimmer-btn" onclick="M.goTab('food')">＋ 记录饮食</button>
            <button class="btn btn-ghost btn-sm press" onclick="M.goExercise()">＋ 记录运动</button>
          </div>
        </div>
        <!-- 喝水 / 体重 快捷记录（放大版 + 背景可视化） -->
        <div class="quick-log-row">
          <button class="card quick-log press" onclick="M.openWater()">

  // 一键添加整套餐（该餐次所有食物 + 克重 → 按当前餐次记录）
  function addMealPlan(meal) {
    const s = F.load();
    const m = D.methods.find(x => x.id === s.profile.method);
    if (!m || !m.mealPlans) return;
    const plan = m.mealPlans.find(p => p.meal === meal);
    if (!plan) return;
    F.setState(st => {
      st.records.food = st.records.food || [];
      plan.items.forEach(it => {
        const f = D.foods.find(x => x.name === it.name);
        const kcal = f ? Math.round(f.calories * it.grams / 100) : 0;
        st.records.food.push({ date: F.todayKey(), meal: meal, name: it.name, grams: it.grams, kcal: kcal, cost: 0, mood: "happy", note: "", img: null, sticker: null, ts: Date.now() });
      });
    });
    renderFood();
    renderHome();
    showToast(plan.meal + "已整套添加（" + plan.items.length + " 种）", IC("check"));
  }

    const map = {

      "鸡胸": "鸡胸肉", "鸡胸肉": "鸡胸肉", "鸡大胸": "鸡胸肉",
      "鸡腿": "鸡腿", "鸡翅": "鸡翅中", "鸡翅中": "鸡翅中",
      "五花肉": "五花肉", "猪肉": "五花肉", "里脊": "猪里脊", "猪里脊": "猪里脊",
      "牛肉": "牛腩", "牛腩": "牛腩",
      "黄瓜": "黄瓜", "青瓜": "黄瓜",
      "西兰花": "西兰花", "绿菜花": "西兰花",
      "豆腐": "嫩豆腐", "嫩豆腐": "嫩豆腐", "老豆腐": "嫩豆腐",
      "茄子": "紫茄子", "紫茄子": "紫茄子",
      "香菇": "香菇", "冬菇": "香菇",
      "鲈鱼": "鲈鱼", "鱼": "鲈鱼",
      "蒜苗": "蒜苗", "青蒜": "蒜苗",
      "小葱": "小葱", "葱": "小葱",
      "洋葱": "洋葱", "紫皮洋葱": "洋葱"
    };
    const t = s.trim();
    return map[t] || t;
  }
  // 食材匹配：输入食材列表 → 按命中食材数排序的菜谱
  function rpMatch(inputs) {
    const norm = inputs.map(rpNormalize);
    return D.recipes.map(r => {
      const ingNames = r.ingredients.map(i => i.name);
      const hit = ingNames.filter(n => norm.includes(n));
      return { recipe: r, hit, score: hit.length };
    })
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score);
  }

  // 调味品数量缩放：解析 amount 中的数字（如 "15ml" "3g" "4片" "2瓣" "1罐"），按人数比例调整；小数单位四舍五入，计数单位（片/瓣/个/根/罐/块）向上取整到≥1
  function rpScaleAmt(amount, k) {
    const m = amount.match(/^([\d.]+)\s*(.*)$/);
    if (!m) return amount;
    const num = parseFloat(m[1]);
    const unit = m[2];
    const countUnits = ["片", "瓣", "个", "根", "罐", "块", "朵", "条"];
    let v = num * k;
    if (countUnits.some(u => unit.includes(u))) v = Math.max(1, Math.round(v));
    else v = Math.round(v);
    return (v < 1 && v > 0 ? v.toFixed(1) : v) + unit;
  }

  // 是否配置了 AI Key

  // AI 生成食谱：本地库没有匹配时也可用；有 Key 用 DeepSeek 联网生成，无 Key 从本地库组合生成
  function rpAiGenerate() {
    const out = $("#rp-ai-result");

    const ingList = rpIngs.join("、");
    if (!rpIngs.length) { showToast("先添加食材"); return; }

    if (key) {
      out.innerHTML = `<div class="rp-ai-result"><div class="micro muted" style="margin-bottom:6px">AI 生成中…（联网获取村驴风格家常做法）</div></div>`;
      rpAiFetch(key, ingList, rpPeople);
    } else {
      // 无 Key：从本地菜谱库挑选最接近的组合，提示可配置 Key 获得更灵活生成
      const base = rpResults[0];
      const r = base ? base.recipe : null;
      out.innerHTML = `<div class="rp-ai-result">${r ? (
        `<div class="micro muted" style="margin-bottom:6px">本地智能推荐 · 在「我的-设置」填入 DeepSeek Key 可用 AI 生成更灵活的新菜谱</div>

      ) : (
        `<div class="micro muted" style="margin-bottom:6px">在「我的-设置」填入 DeepSeek Key 可用 AI 按「${ingList}」生成新菜谱</div>

  // 调用 DeepSeek（OpenAI 兼容接口）生成食谱
  function rpAiFetch(key, ings, people) {
    const out = $("#rp-ai-result");
    const prompt = `你是一个接地气的家常菜博主"村驴"，擅长用快手家常菜喂饱一家人。请用以下食材：${ings}，生成一道 ${people} 人份的菜谱。要求：
1. 菜名（村驴风格，接地气好记）
2. 食材清单（含 ${people} 人份克重，尽量全部用上现有食材）
3. 调味品（含数量）
4. 做法步骤（3-6步，口语化、接地气、可操作）
请用简洁中文输出，格式：
【菜名】
【食材】xxx
【调味】xxx
【做法】1.xxx 2.xxx`;
    fetch("https://api.deepseek.com/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({
        model: "deepseek-chat",
        messages: [{ role: "user", content: prompt }],
        max_tokens: 800,
        temperature: 0.8
      })
    })
    .then(res => { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(data => {
      const text = data.choices && data.choices[0] && data.choices[0].message.content;
      if (!text) throw new Error("空响应");
      out.innerHTML = `<div class="rp-ai-result"><div class="micro muted" style="margin-bottom:6px">村驴 AI 生成 · ${ings} · ${people} 人份</div>${text}</div>`;
    })
    .catch(err => {
      out.innerHTML = `<div class="rp-ai-result"><div class="micro muted" style="margin-bottom:6px">AI 调用失败</div>${err.message}<br>请检查 API Key 或网络；无 Key 时会自动用本地菜谱库推荐</div>`;
    });
  }

  function renderQuizResult() {
    const [bmi, diet, speed, ex] = quizAnswers;
    const scores = {};
    D.methods.forEach(m => scores[m.id] = 0);
    const add = (id, n) => scores[id] = (scores[id] || 0) + n;
    if (bmi === "heavy") { add("harvard", 2); add("keto", 1); add("carb_cycle", 1); }
    if (bmi === "mid") { add("carb_cycle", 2); add("168", 2); add("keto", 1); }
    if (bmi === "low") { add("168", 3); add("carb_cycle", 1); }
    if (diet === "strict") { add("harvard", 3); add("keto", 2); add("liquid", 1); }
    if (diet === "mid") { add("carb_cycle", 3); add("168", 2); }
    if (diet === "loose") { add("168", 4); add("carb_cycle", 1); }
    if (speed === "fast") { add("harvard", 3); add("liquid", 2); add("keto", 2); }
    if (speed === "steady") { add("carb_cycle", 3); add("168", 3); }
    if (ex === "regular") { add("carb_cycle", 3); add("keto", 1); }
    if (ex === "occasional") { add("168", 2); add("carb_cycle", 1); }
    if (ex === "none") { add("liquid", 1); add("168", 1); }
    const top = Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, 2);
    $("#page-quiz").innerHTML = `
      <div class="navbar"><button class="back" onclick="M.quizRestart()"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="tt">推荐结果</div><span class="sp"></span></div>

  function calMonthStat(s) {
    const ym = calYear + "-" + String(calMonth).padStart(2, "0");
    const monthFoods = (s.records.food || []).filter(f => f.date && f.date.startsWith(ym));
    const cnt = monthFoods.length;
    const cost = monthFoods.reduce((a, f) => a + (f.cost || 0), 0);
    return `<span class="cal-stat-num">${cnt} 餐</span> · <span class="cal-stat-cost">¥${cost.toFixed(2)}</span>`;

  // 生成日历网格 HTML（供弹层与饮食页内嵌共用）
  function calGridHtml() {
    const s = F.load();
    const first = new Date(calYear, calMonth - 1, 1);
    const startDay = first.getDay();
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    const today = F.todayKey();
    let html = "";
    ["日","一","二","三","四","五","六"].forEach(w => { html += `<span class="cal-wd">${w}</span>`; });
    for (let i = 0; i < startDay; i++) html += '<span class="cal-empty"></span>';
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = calYear + "-" + String(calMonth).padStart(2, "0") + "-" + String(d).padStart(2, "0");

  // 拼贴画布交互：拖动移动 + 右下角缩放
  function initCollageDrag() {
    const canvas = $("#collage-canvas");
    if (!canvas) return;
    const items = canvas.querySelectorAll(".collage-item");
    items.forEach(item => {
      // 拖动移动
      item.addEventListener("mousedown", e => {
        if (e.target.classList.contains("ci-resize")) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const sx = e.clientX, sy = e.clientY;
        const ox = parseFloat(item.style.left), oy = parseFloat(item.style.top);
        function mv(ev) {
          const t = ev.touches ? ev.touches[0] : ev;
          let nx = ox + (t.clientX - sx) / rect.width * 100;
          let ny = oy + (t.clientY - sy) / rect.height * 100;
          nx = Math.max(0, Math.min(100 - 30, nx));
          ny = Math.max(0, Math.min(100 - 20, ny));
          item.style.left = nx + "%";
          item.style.top = ny + "%";
          ev.preventDefault();
        }
        function up() {
          document.removeEventListener("mousemove", mv);
          document.removeEventListener("mouseup", up);
          document.removeEventListener("touchmove", mv);
          document.removeEventListener("touchend", up);
        }
        document.addEventListener("mousemove", mv);
        document.addEventListener("mouseup", up);
        document.addEventListener("touchmove", mv, { passive: false });
        document.addEventListener("touchend", up);
      });
      // 右下角缩放
      const rz = item.querySelector(".ci-resize");
      if (rz) rz.addEventListener("mousedown", e => {
        e.preventDefault();
        e.stopPropagation();
        const sx = e.clientX, sy = e.clientY;
        const ow = parseFloat(item.style.width || 110);
        function mv(ev) {
          const t = ev.touches ? ev.touches[0] : ev;
          let nw = ow + (t.clientX - sx);
          nw = Math.max(60, Math.min(180, nw));
          item.style.width = nw + "px";
          ev.preventDefault();
        }
        function up() {
          document.removeEventListener("mousemove", mv);
          document.removeEventListener("mouseup", up);
          document.removeEventListener("touchmove", mv);
          document.removeEventListener("touchend", up);
          // 保存大小
          const i = parseInt(item.dataset.ci);
          const s2 = F.load();
          const arr = s2.records.food || [];
          let idx = -1;
          for (let k = 0; k < arr.length; k++) {
            if (arr[k].date === calSelDate) { idx++; if (idx === i) { arr[k].sz = parseFloat(item.style.width); break; } }
          }
          F.save(s2);
        }
        document.addEventListener("mousemove", mv);
        document.addEventListener("mouseup", up);
        document.addEventListener("touchmove", mv, { passive: false });
        document.addEventListener("touchend", up);
      });
    });
  }

  function initSeDrag() {
    const canvas = $("#se-canvas");
    const img = $("#se-img");
    if (!canvas || !img) return;
    // 触屏 + 鼠标拖拽移动
    let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    function start(e) {
      dragging = true;
      const t = e.touches ? e.touches[0] : e;
      sx = t.clientX; sy = t.clientY;
      const rect = canvas.getBoundingClientRect();
      ox = parseFloat(img.style.left || "0");
      oy = parseFloat(img.style.top || "0");
      e.preventDefault();
    }
    function move(e) {
      if (!dragging) return;
      const t = e.touches ? e.touches[0] : e;
      img.style.left = (ox + (t.clientX - sx)) + "px";
      img.style.top = (oy + (t.clientY - sy)) + "px";
      e.preventDefault();
    }
    function end() { dragging = false; }
    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    canvas.addEventListener("mouseup", end);
    canvas.addEventListener("mouseleave", end);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", end);
  }
  function seZoom(d) {
    const img = $("#se-img");
    if (!img) return;
    const cur = parseFloat(img.style.width || "100%");
    let nw = Math.max(30, Math.min(300, cur + d * 100));
    img.style.width = nw + "%";
  }
  function seReset() {
    const img = $("#se-img");

  function seSave() {
    const s = F.load();
    const dayFoods = (s.records.food || []).filter(f => f.date === calSelDate);
    const f = dayFoods[editFoodIndex];
    if (!f) return;
    // 从画布区域截取（裁剪）：把 se-canvas 可视区域渲染为新贴纸
    const canvas = $("#se-canvas");
    const img = $("#se-img");
    if (!canvas || !img) { showToast("保存失败"); return; }
    const cRect = canvas.getBoundingClientRect();
    const iRect = img.getBoundingClientRect();
    // 计算可视交集的相对比例
    const cx0 = Math.max(0, cRect.left - iRect.left) / iRect.width;
    const cy0 = Math.max(0, cRect.top - iRect.top) / iRect.height;
    const cx1 = Math.min(1, (cRect.right - iRect.left) / iRect.width);
    const cy1 = Math.min(1, (cRect.bottom - iRect.top) / iRect.height);
    const out = document.createElement("canvas");
    out.width = 300; out.height = 300;
    const octx = out.getContext("2d");
    const imgEl = new Image();
    imgEl.onload = () => {
      octx.drawImage(imgEl, cx0 * imgEl.width, cy0 * imgEl.height, (cx1 - cx0) * imgEl.width, (cy1 - cy0) * imgEl.height, 0, 0, 300, 300);
      const newSticker = out.toDataURL("image/png");
      F.setState(st => {
        const arr = st.records.food || [];
        let idx = -1;
        for (let k = 0; k < arr.length; k++) {
          if (arr[k].date === calSelDate) { idx++; if (idx === editFoodIndex) { arr[k].sticker = newSticker; break; } }
        }
      });
      renderHome();
      openDayDetail(calSelDate);
      showToast("贴纸已保存");
    };
    imgEl.src = img.src;
  }

  // 自动识别食物主体、过滤背景，输出透明背景贴纸（简化 GrabCut：背景色采样 + 颜色距离 + 边缘羽化）
  // 失败时降级：回调 null，调用方用原图
  function removeBackground(imgDataUrl, cb) {
    // 优先 AI API
    aiRemoveBackground(imgDataUrl, aiSticker => {
      if (aiSticker) { cb(aiSticker); return; }
      // 本地降级：背景色采样 + 颜色距离 + 边缘羽化
      try {
        const img = new Image();
        img.onload = () => {
          try {
            const W = Math.min(400, img.width), H = Math.round(img.height * W / img.width);
            const c = document.createElement("canvas");
            c.width = W; c.height = H;
            const ctx = c.getContext("2d");
            ctx.drawImage(img, 0, 0, W, H);
            const data = ctx.getImageData(0, 0, W, H);
            const d = data.data;
            const corners = [
              [0, 0], [W - 1, 0], [0, H - 1], [W - 1, H - 1],
              [Math.floor(W / 2), 0], [0, Math.floor(H / 2)], [W - 1, Math.floor(H / 2)], [Math.floor(W / 2), H - 1]
            ];
            let rSum = 0, gSum = 0, bSum = 0;
            corners.forEach(([x, y]) => {
              const i = (y * W + x) * 4;
              rSum += d[i]; gSum += d[i + 1]; bSum += d[i + 2];
            });
            const br = rSum / corners.length, bg = gSum / corners.length, bb = bSum / corners.length;
            const threshold = 95, edge = 22;
            for (let i = 0; i < d.length; i += 4) {
              const dr = d[i] - br, dg = d[i + 1] - bg, db = d[i + 2] - bb;
              const dist = Math.sqrt(dr * dr + dg * dg + db * db);
              if (dist < threshold) {
                let alpha = 0;
                if (dist > threshold - edge) alpha = Math.round((dist - (threshold - edge)) / edge * 255);
                d[i + 3] = alpha;
              }
            }
            ctx.putImageData(data, 0, 0);
            cb(c.toDataURL("image/png"));
          } catch (e) { cb(null); }
        };
        img.onerror = () => cb(null);
        img.src = imgDataUrl;
      } catch (e) { cb(null); }
    });
  }

  // 体重折线图（弹层内放大版）
  function weightChartHtml(s) {
    const hist = (s.records.weight || []).slice(-12);
    if (hist.length < 2) {
      return `<div class="wcp-empty">记录 2 次体重后显示趋势曲线</div>`;
    }
    const W = 300, H = 110, pad = 14;
    const vals = hist.map(h => h.kg);
    const min = Math.min(...vals, s.profile.targetWeight) - 1;
    const max = Math.max(...vals, s.profile.weight) + 1;
    const x = i => pad + (W - pad * 2) * (i / (hist.length - 1));
    const y = v => pad + (H - pad * 2) * (1 - (v - min) / (max - min));
    const d = hist.map((h, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(h.kg).toFixed(1)).join(" ");
    const pts = hist.map((h, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(h.kg).toFixed(1)}" r="3" fill="var(--charcoal)"/>`).join("");
    const ty = y(s.profile.targetWeight).toFixed(1);
    return `<svg class="wcp-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="14" y1="${ty}" x2="${W - 14}" y2="${ty}" stroke="rgba(201,154,61,0.5)" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="${d}" fill="none" stroke="var(--charcoal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  }

      const y = v => pad + (H - pad * 2) * (1 - (v - min) / (max - min));
      const d = hist.map((h, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(h.kg).toFixed(1)).join(" ");
      const pts = hist.map((h, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(h.kg).toFixed(1)}" r="3" fill="var(--charcoal)"/>`).join("");
      const ty = y(s.profile.targetWeight).toFixed(1);
      chart = `<svg class="wc-svg" viewBox="0 0 320 160">
        <line x1="24" y1="${ty}" x2="296" y2="${ty}" stroke="rgba(201,154,61,0.55)" stroke-width="1.5" stroke-dasharray="4 4"/>
        <path d="${d}" fill="none" stroke="var(--charcoal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts}
      </svg>
      <div class="small muted mt8">橙色虚线 = 目标体重 ${s.profile.targetWeight} kg</div>`;
    } else {
      chart = `<div class="empty-card" style="margin:0">体重记录不足 2 条，先去首页记录一次体重吧</div>`;
    }
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <div class="h2">体重曲线</div>
      <div class="small muted mt8">当前 ${s.profile.weight} kg · 目标 ${s.profile.targetWeight} kg</div>
      <div class="mt16">${chart}</div>
      <button class="btn btn-primary btn-block shimmer-btn mt16" onclick="M.closeSheet()">关闭</button>`;
    $("#serving-mask").classList.add("show");
  }
  function closeSheet() { $("#serving-mask").classList.remove("show"); }

  /* ================= 里程碑庆祝 ================= */
  function checkMilestone() {
    const s = F.load();
    const sum = F.todaySummary(s);
    const p = sum.weightProgress;
    const ms = s.milestones || {};
    const points = [20, 50, 80, 100];
    // 找当前跨越的里程碑（升序，只触发最近一个）
    let hit = null;
    for (const pt of points) {
      if (p >= pt && !ms[pt]) hit = pt;
    }
    if (hit === null) return;
    F.setState(st => { st.milestones = Object.assign({}, st.milestones || {}, { [hit]: true }); });
    showCelebrate(hit);
  }
  function showCelebrate(pt) {
    const labels = {
      20: "目标完成 20%，好开始！",
      50: "目标完成 50%，过半了！",
      80: "目标完成 80%，冲刺！",
      100: "目标完成 100%，太棒了！"
    };
    const conf = document.createElement("div");
    conf.className = "celebrate";
    conf.innerHTML = `
      <div class="celebrate-card">
        <div class="cel-ic">${IC("trophy")}</div>
        <div class="cel-t">${labels[pt]}</div>
        <div class="cel-s">减重目标进度 ${pt}%</div>
        <button class="btn btn-primary btn-sm" onclick="this.closest('.celebrate').remove()">继续加油</button>
      </div>
      <div class="confetti"></div>`;
    document.querySelector(".phone").appendChild(conf);
    setTimeout(() => conf.remove(), 3000);
  }

  /* ================= 时钟 ================= */
  function tickClock() {
    const d = new Date();
    $("#sb-time").textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ================= 初始化 ================= */
  $$(".tab").forEach(b => b.addEventListener("click", () => goTab(b.dataset.tab)));
  $("#serving-mask").addEventListener("click", e => { if (e.target.id === "serving-mask") $("#serving-mask").classList.remove("show"); });
  // 全局按钮点击动效：任何 button / 带 onclick 的元素点击时注入涟漪 + 按压反馈
  document.addEventListener("click", e => {
    const el = e.target.closest("button, [onclick], .press, .m-card, .kb-card, .quick-log, .menu-item, .day-food-card, .collage-item, .rec-item .del");
    if (!el) return;
    // 按压缩放
    if (!el.classList.contains("fx-btn")) {
      el.classList.add("fx-btn");
    }
    // 涟漪波纹（深色底用深色波纹，浅色按钮用浅色）
    const rect = el.getBoundingClientRect();
    const d = Math.max(rect.width, rect.height);
    const wave = document.createElement("span");
    wave.className = "fx-wave" + (el.classList.contains("btn-primary") ? "" : " dark");
    wave.style.width = wave.style.height = d + "px";
    wave.style.left = (e.clientX - rect.left - d / 2) + "px";
    wave.style.top = (e.clientY - rect.top - d / 2) + "px";
    el.appendChild(wave);
    setTimeout(() => wave.remove(), 550);
    // 图标微弹
    const ic = el.querySelector("svg");
    if (ic) {
      el.classList.remove("fx-ic");
      void el.offsetWidth;
      el.classList.add("fx-ic");
    }
  }, true);
  tickClock(); setInterval(tickClock, 10000);
  // 窗口尺寸变化后重算指示器位置
  window.addEventListener("resize", () => moveIndicator(tab));
  // hash 路由：?page=kb 支持按页面截图（html.to.design 逐个导入）
  (function routeInit() {
    const m = location.search.match(/[?&]page=([\w-]+)/);
    const page = m ? m[1] : "home";
    goTab(["home", "food", "kb", "exercise", "me", "detail", "compare", "quiz", "diary", "ledger"].includes(page) ? page : "home");
    if (page === "detail") openDetail(location.hash.replace("#", "") || "168");
  })();

  window.M = { goTab, goRecipe, goKb, goKbFromHome, kbBack, goExercise, rpAdd, rpRemove, rpPeopleSet, rpSelect, rpAiGenerate, openDetail, openDetailFromHome, detailBack, adoptMethod, adoptFromQuiz, addFood, stepAmount, confirmFood, delFood, editFood, saveFoodEdit, pickEx, setInt, confirmEx, delEx, quizAnswer, quizBack, quizRestart, openWater, pickDrink, stepWater, confirmWater, delWater, stepGoal, openWeight, setWeightUnit, confirmWeight, openMeEdit, setPersona, setPace, saveBody, saveSettings2, openWeightChart, closeSheet, renderDiary, openDiary, pickMood, addDiaryImage, saveDiary, delDiary, viewDiary, openLedger, addExpense, delExpense, pickLedgerCat, addCustomCat, addExpensePage, delExpensePage, setLedgerType, goLedgerPage, openFoodCalendar, calPrevMonth, calNextMonth, calPickDate, addFoodRecord, pickFoodImg, pickFrMood, pickFrMeal, pickFrSearch, saveFoodTemplate, fillFoodTemplate, delFoodTemplate, saveFoodRecord, delFoodRecord, calPrevMonth2, calNextMonth2, delFoodRec2, editFoodRec2, editDayFood, delDayFood, openDayDetail, openStickerEditor, seZoom, seReset, seSave, addMealPlan };
})();
